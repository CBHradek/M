<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zpěvník - Mládež</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f121e 0%, #1a1f36 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #8ea6bd;
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 85%;
            max-width: 300px;
            padding: 14px 20px;
            color: #b094ff;
            border: 2px solid #b094ff;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.25s ease;
        }
        .btn:hover {
            border-color: #d5c7ff;
            color: #d5c7ff;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mládežový Zpěvník</h1>
    <p>Klikni na tlačítko níže pro stažení zpěvníku v PDF přímo do tvého telefonu.</p>

    <a href="mladezovy_zpevnik.pdf" class="btn" download>Stáhnout zpěvník ➔</a>
</div>

</body>
</html>
